services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-selvam}
      POSTGRES_USER: ${POSTGRES_USER:-selvam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env for local Postgres mode}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selvam} -d ${POSTGRES_DB:-selvam}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-selvam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selvam}
      DATABASE_URL_DIRECT: postgres://${POSTGRES_USER:-selvam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selvam}

  drizzle-studio:
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-selvam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selvam}
      DATABASE_URL_DIRECT: postgres://${POSTGRES_USER:-selvam}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-selvam}

volumes:
  postgres_data:
