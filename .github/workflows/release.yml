name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release Tag (e.g. v1.1.0)"
        required: true
        default: "v1.1.0"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    name: Verify & Package Standalone Bundles
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOVEREIGN_MODE: "true"
      DATABASE_URL: "pglite://local"
      BETTER_AUTH_SECRET: "selvam-sovereign-master-secret-key-32chars-min-zero-cloud"
      BETTER_AUTH_URL: "http://localhost:3001"
      CORS_ORIGIN: "http://localhost:3001"
      SKIP_ENV_VALIDATION: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check all workspaces
        run: pnpm check-types

      - name: Run automated test suites
        run: |
          pnpm --filter @portfolio/calc test
          pnpm --filter @portfolio/parsers test
          pnpm --filter @portfolio/auth test
          pnpm --filter @portfolio/db test

      - name: Build Next.js standalone application
        run: pnpm --filter web build

      - name: Package multi-platform release bundles
        id: package
        run: |
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          echo "Packaging release for tag: $TAG"
          node scripts/package-release.mjs "$TAG"

      - name: Create or Update GitHub Release with Standalone Bundles
        uses: softprops/action-gh-release@v2
        with:
          name: "Selvam Sovereign Financial OS ${{ github.event.inputs.tag_name || github.ref_name }}"
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/releases/*.tar.gz
            dist/releases/*.zip
            dist/releases/checksums.txt

  build-native-desktop:
    name: Build Native Desktop (${{ matrix.platform }})
    needs: verify-and-package
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            target-name: "macOS (.dmg & .app)"
            args: ""
          - platform: "windows-latest"
            target-name: "Windows (.exe & .msi)"
            args: ""
          - platform: "ubuntu-22.04"
            target-name: "Linux (.deb & .AppImage)"
            args: ""

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri Desktop Native Installers (.dmg / .exe / .deb)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.event.inputs.tag_name || github.ref_name }}
          releaseName: "Selvam Sovereign Financial OS ${{ github.event.inputs.tag_name || github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  docker-image:
    name: Build & Publish Multi-Arch Container (GHCR)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify-and-package

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.event.inputs.tag_name }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
